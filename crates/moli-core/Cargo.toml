[package]
name = "moli-core"
description = "Platform-independent core of MoliWhisper: Doubao ASR client, session logic, audio DSP."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
chacha20poly1305 = "0.11"
cpal = "0.18"
dirs = "7"
futures-util.workspace = true
keyring-core = "1"
rtrb = "0.4"
rubato = "5"
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
anyhow.workspace = true
hound.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }
