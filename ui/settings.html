<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>MoliWhisper 设置</title>
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <main>
      <div id="error" class="banner warn" hidden></div>
      <section>
        <h2>语音识别</h2>
        <div class="fields">
          <label class="field">
            <span class="label">千问 API Key</span>
            <input id="qwen-key" class="grow" type="password" spellcheck="false" placeholder="sk-…" />
          </label>
          <div class="row">
            <span id="qwen-msg" class="grow note"></span>
            <button id="qwen-test">保存并测试</button>
          </div>
        </div>
      </section>

      <section>
        <h2>自动整理</h2>
        <label class="row check">
          <span class="grow">
            口语 → 书面语
            <span class="note">识别完先去掉口头语、理顺语句再粘贴；整理失败或超过 15 秒时粘贴原文。</span>
          </span>
          <input id="organize" type="checkbox" />
        </label>
        <div id="deepseek" class="fields">
          <label class="field">
            <span class="label">DeepSeek API Key</span>
            <input id="deepseek-key" class="grow" type="password" spellcheck="false" placeholder="sk-…" />
          </label>
          <label class="field top">
            <span class="label">提示词</span>
            <textarea id="deepseek-prompt" class="grow" rows="4"></textarea>
          </label>
          <div class="row">
            <span id="deepseek-msg" class="grow note"></span>
            <button id="deepseek-test">保存并测试</button>
          </div>
        </div>
      </section>

      <section>
        <h2>热键</h2>
        <div class="row">
          <div class="grow">
            <div id="hotkey-label" class="value key">—</div>
            <div id="hotkey-usage" class="note"></div>
          </div>
          <button id="record">更改…</button>
          <button id="reset-hotkey" class="subtle">恢复默认</button>
        </div>
        <div id="recording" class="banner" hidden>
          请按下新的热键：单独按一下某个修饰键（如右 Option），或按住修饰键再按一个键。按 ESC 取消。
          <button id="cancel-record" class="subtle">取消</button>
        </div>
        <div id="hook-warning" class="banner warn" hidden></div>
        <div class="row">
          <span class="label">模式</span>
          <div class="segmented" role="radiogroup">
            <label><input type="radio" name="mode" value="toggle" /> 切换</label>
            <label><input type="radio" name="mode" value="push_to_talk" /> 按住说话</label>
          </div>
        </div>
        <div class="note">录音时按 ESC 取消，识别结果会自动粘贴到当前光标处。</div>
      </section>

      <section>
        <h2>权限</h2>
        <div class="row">
          <span class="label">辅助功能</span>
          <span id="ax-status" class="grow status"></span>
          <button id="ax-open" class="subtle">打开系统设置</button>
        </div>
        <div class="note">用于监听热键和自动粘贴。</div>
        <div class="row">
          <span class="label">麦克风</span>
          <span id="mic-status" class="grow status"></span>
          <button id="mic-open" class="subtle">打开系统设置</button>
        </div>
      </section>

      <section>
        <h2>通用</h2>
        <label class="row check">
          <span class="grow">登录时自动启动</span>
          <input id="autostart" type="checkbox" />
        </label>
        <label class="row check">
          <span class="grow">粘贴后恢复原来的剪贴板内容</span>
          <input id="restore" type="checkbox" />
        </label>
        <div class="row">
          <span class="grow">
            更新
            <span class="note">每小时检查一次 GitHub 上的新版本，有新版本时询问是否安装。</span>
          </span>
          <button id="check-update">检查更新…</button>
        </div>
      </section>

      <section>
        <details id="advanced">
          <summary>高级</summary>
          <p class="note">配置文件：<code id="config-path"></code></p>
        </details>
      </section>

      <footer id="version"></footer>
    </main>
    <script type="module" src="./settings.ts"></script>
  </body>
</html>
