[project]
name = "moli-asr-server"
version = "0.1.0"
description = "Streaming speech recognition server for MoliWhisper, running Qwen3-ASR"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy",
]

[project.optional-dependencies]
# The model itself; needs an NVIDIA GPU. Without it, only `--fake` works.
qwen = ["qwen-asr[vllm]"]

[dependency-groups]
dev = ["pytest", "httpx"]

[project.scripts]
moli-asr-server = "moli_asr_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["moli_asr_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
