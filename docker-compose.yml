# 自建语音识别服务。在有 NVIDIA 显卡的机器上：
#
#   cp .env.example .env     # 然后把 MOLI_ASR_TOKEN 改成一串随机字符
#   docker compose up -d      # 从 GHCR 拉镜像；改了 server/ 想本地构建就加 --build
#
# 没有显卡、只想调试客户端：docker compose --profile fake up -d --build asr-fake
# 详见 server/README.md。

name: moliwhisper

services:
  asr:
    build:
      context: ./server
      target: gpu
    image: ghcr.io/moliduo/moliwhisper-asr:latest # server/ 有改动时由 CI 构建发布
    restart: unless-stopped
    ports:
      # MOLI_BIND 默认监听所有网卡；只想让 Tailscale 能访问时填本机的 100.x.y.z
      - "${MOLI_BIND:-0.0.0.0}:${MOLI_PORT:-8765}:8765"
    environment:
      MOLI_ASR_TOKEN: ${MOLI_ASR_TOKEN:?先复制 .env.example 为 .env，并设置 MOLI_ASR_TOKEN}
      MOLI_ASR_MODEL: ${MOLI_ASR_MODEL:-Qwen/Qwen3-ASR-1.7B}
      MOLI_ASR_LANGUAGE: ${MOLI_ASR_LANGUAGE:-}
      MOLI_ASR_CONTEXT: ${MOLI_ASR_CONTEXT:-}
      MOLI_GPU_MEMORY_UTILIZATION: ${MOLI_GPU_MEMORY_UTILIZATION:-0.8}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
    volumes:
      - models:/models # 模型缓存，重建容器不用重新下载
    shm_size: 4gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # 不带模型的版本，不需要显卡
  asr-fake:
    profiles: [fake]
    build:
      context: ./server
      target: fake
    image: moliwhisper/asr-server:fake
    ports:
      - "${MOLI_BIND:-0.0.0.0}:${MOLI_PORT:-8765}:8765"
    environment:
      MOLI_ASR_TOKEN: ${MOLI_ASR_TOKEN:?先复制 .env.example 为 .env，并设置 MOLI_ASR_TOKEN}

volumes:
  models:
