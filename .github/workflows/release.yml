name: release

# Publishes the app (MoliSpec 006 §6.5, release.mode: manual): push a tag vX.Y.Z on the commit that is the
# head of main and that `ci` has passed, after `chore(release): vX.Y.Z` set `version` in package.json.
#
#   prepare  checks the tag, the signing secrets and the update key, drafts the release with its notes
#   build    macOS arm64 (.app update archive and .dmg), signed with the shared certificate and the update key
#   release  checks what the build made, adds latest.json (the update feed) and SHA256SUMS to the draft,
#            makes sure main has not moved, publishes, then reads the published feed the way an installed
#            app will and puts the release back to draft if that does not check out
#
# "Run workflow" by hand is a dry run: the same build, update-signed with a throwaway key and checked the
# same way, but nothing is published; the files are kept as the run's artifacts for a week.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, and never cancelled halfway (that leaves a draft behind).
concurrency:
  group: release
  cancel-in-progress: false

env:
  # SHA-1 of the shared "Moli Self-Signed Code Signing" certificate (MoliSpec 007 §7.5.1). Not a secret.
  # Another certificate would make every user grant Accessibility and the microphone again.
  CODESIGN_FINGERPRINT: 319b1ba057375e21ae752764d4fcd38b6c13d9f6

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the draft release
      checks: read # whether ci passed on this commit
    outputs:
      version: ${{ steps.version.outputs.version }}
      dry: ${{ steps.version.outputs.dry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Work out the version
        id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ]; then dry=false; else dry=true; fi
          echo "dry=$dry" >> "$GITHUB_OUTPUT"

      - name: Check the tag
        if: steps.version.outputs.dry == 'false'
        run: node scripts/release/cli.ts check-tag "$GITHUB_REF_NAME"

      - name: Check this is the head of main and that ci passed on it
        if: steps.version.outputs.dry == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_REF_NAME is not the head of main ($head); tag the latest commit of main instead"
            exit 1
          fi
          result=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "ci-gate")] | map(.conclusion) | first // "none"')
          if [ "$result" != success ]; then
            echo "::error::ci-gate is '$result' on this commit; wait for ci to pass, then tag again"
            exit 1
          fi

      # Without the keys nothing can be signed, and a release the installed apps cannot verify must not go
      # out (MoliSpec 007 §7.6.2).
      - name: Check the signing keys
        env:
          DRY: ${{ steps.version.outputs.dry }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CODESIGN_P12_BASE64: ${{ secrets.CODESIGN_P12_BASE64 }}
          CODESIGN_P12_PASSWORD: ${{ secrets.CODESIGN_P12_PASSWORD }}
        run: |
          ok=true
          names="CODESIGN_P12_BASE64 CODESIGN_P12_PASSWORD"
          [ "$DRY" = true ] || names="$names TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          for name in $names; do
            if [ -z "${!name}" ]; then
              echo "::error::the secret $name is not set (scripts/setup-updater-keys.sh makes the update key)"
              ok=false
            fi
          done
          if [ -z "$(node -p 'require("./src-tauri/tauri.conf.json").plugins?.updater?.pubkey ?? ""')" ]; then
            echo "::error::src-tauri/tauri.conf.json has no plugins.updater.pubkey"
            ok=false
          fi
          $ok

      - name: Make a throwaway update key for the dry run
        if: steps.version.outputs.dry == 'true'
        run: |
          pnpm install --frozen-lockfile
          mkdir dry-key
          pnpm -s tauri signer generate --ci -w dry-key/updater.key -p dry > /dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.version.outputs.dry == 'true'
        with:
          name: dry-key
          path: dry-key/
          retention-days: 1

      - name: Write the release notes
        run: |
          tag="v${{ steps.version.outputs.version }}"
          node scripts/release/cli.ts notes "$tag" "$GITHUB_SHA" > notes.md
          cat notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-notes
          path: notes.md
          retention-days: 7

      # Drafted first, filled in by `release`, public only when it is complete (MoliSpec 006 §6.5.3).
      - name: Draft the release
        if: steps.version.outputs.dry == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            if [ "$(gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != true ]; then
              echo "::error::$GITHUB_REF_NAME is already published; it is not overwritten"
              exit 1
            fi
            gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "Moli Whisper $VERSION" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "Moli Whisper $VERSION" --notes-file notes.md
          fi

  build:
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      DRY: ${{ needs.prepare.outputs.dry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install the Rust toolchain
        run: rustup toolchain install # the version in rust-toolchain.toml
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: env.DRY == 'true'
        with:
          name: dry-key
          path: dry-key

      # The update archive is made when this is set; the dry run points it at the throwaway key's public half.
      - name: Choose the update key
        run: |
          if [ "$DRY" = true ]; then
            pub=$(tr -d '\n' < dry-key/updater.key.pub)
            config=$(PUB="$pub" node -p 'JSON.stringify({bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:process.env.PUB,endpoints:["https://example.invalid/latest.json"]}}})')
          else
            config='{"bundle":{"createUpdaterArtifacts":true}}'
          fi
          echo "RELEASE_TAURI_CONFIG=$config" >> "$GITHUB_ENV"

      # A throwaway keychain with the shared self-signed certificate (MoliSpec 007 §7.5.1); deleted below.
      - name: Import the signing certificate
        env:
          CODESIGN_P12_BASE64: ${{ secrets.CODESIGN_P12_BASE64 }}
          CODESIGN_P12_PASSWORD: ${{ secrets.CODESIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$CODESIGN_P12_BASE64" ] || [ -z "$CODESIGN_P12_PASSWORD" ]; then
            echo "::error::CODESIGN_P12_BASE64 / CODESIGN_P12_PASSWORD are not available; no signed build"
            exit 1
          fi
          keychain="$RUNNER_TEMP/codesign.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/codesign.p12"
          printf '%s' "$CODESIGN_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CODESIGN_P12_PASSWORD" -T /usr/bin/codesign > /dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          rm -f "$certificate"
          # codesign only finds the identity when the keychain is on the search list.
          existing="$(security list-keychains -d user | tr -d '"')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain" $existing
          # Self-signed, so not "valid" to find-identity: no -v.
          if ! security find-identity -p codesigning "$keychain" | grep -qi "$CODESIGN_FINGERPRINT"; then
            echo "::error::the certificate in CODESIGN_P12_BASE64 is not $CODESIGN_FINGERPRINT"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$CODESIGN_FINGERPRINT" >> "$GITHUB_ENV"

      - name: Build and sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.prepare.outputs.dry == 'true' && format('{0}/dry-key/updater.key', github.workspace) || secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ needs.prepare.outputs.dry == 'true' && 'dry' || secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --ci --target aarch64-apple-darwin --bundles app,dmg --config "$RELEASE_TAURI_CONFIG"

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/codesign.keychain-db" 2> /dev/null || true

      # Name the files by MoliSpec 006 §6.6.1, and refuse a package whose version is not the tag's (§6.5.2)
      # or that is not signed with the shared certificate.
      - name: Collect the files
        run: |
          set -euo pipefail
          bundle=target/aarch64-apple-darwin/release/bundle
          app="$bundle/macos/MoliWhisper.app"
          plist="$app/Contents/Info.plist"
          built=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
          if [ "$built" != "$VERSION" ]; then
            echo "::error::the app says $built, the release is $VERSION"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          if ! codesign -d -r- "$app" 2>&1 | grep -qi "certificate leaf = H\"$CODESIGN_FINGERPRINT\""; then
            codesign -dvv "$app" 2>&1 | grep -E 'Authority|Signature' || true
            echo "::error::the app is not signed with the shared certificate $CODESIGN_FINGERPRINT"
            exit 1
          fi
          mkdir out
          cp "$bundle/dmg/MoliWhisper_${VERSION}_aarch64.dmg" "out/MoliWhisper_${VERSION}_macos_arm64.dmg"
          cp "$bundle/macos/MoliWhisper.app.tar.gz" "out/MoliWhisper_${VERSION}_macos_arm64.app.tar.gz"
          cp "$bundle/macos/MoliWhisper.app.tar.gz.sig" "out/MoliWhisper_${VERSION}_macos_arm64.app.tar.gz.sig"
          ls -l out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-macos
          path: out/
          retention-days: 7
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # upload to the draft, publish it
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      DRY: ${{ needs.prepare.outputs.dry }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-macos
          path: out
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-notes
          path: .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: env.DRY == 'true'
        with:
          name: dry-key
          path: dry-key

      - name: The public key the app carries
        id: key
        run: |
          if [ "$DRY" = true ]; then
            echo "pubkey=$(tr -d '\n' < dry-key/updater.key.pub)" >> "$GITHUB_OUTPUT"
          else
            echo "pubkey=$(node -p 'require("./src-tauri/tauri.conf.json").plugins.updater.pubkey')" >> "$GITHUB_OUTPUT"
          fi

      # The update archive's signature checked with that public key, then latest.json and SHA256SUMS
      # written (MoliSpec 006 §6.5.2 and §6.5.6).
      - name: Check the build and write the feed
        run: node scripts/release/cli.ts assemble out "$VERSION" "$GITHUB_REPOSITORY" notes.md "${{ steps.key.outputs.pubkey }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: env.DRY == 'true'
        with:
          name: release-preview
          path: |
            out/MoliWhisper_*
            out/latest.json
            out/SHA256SUMS
          retention-days: 7

      - name: Add the files to the draft
        if: env.DRY == 'false'
        run: |
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber \
            out/MoliWhisper_"$VERSION"_macos_arm64.dmg \
            out/MoliWhisper_"$VERSION"_macos_arm64.app.tar.gz \
            out/latest.json out/SHA256SUMS

      # What is public must be what was built from this tag (MoliSpec 006 §6.5.4).
      - name: Check main has not moved
        if: env.DRY == 'false'
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::main moved on to $head while this was building; the draft $GITHUB_REF_NAME is left unpublished, release again from the new head"
            exit 1
          fi

      - name: Publish
        id: publish
        if: env.DRY == 'false'
        run: gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false --latest

      # What the installed apps will read (MoliSpec 006 §6.5.5; 007 §7.3.3).
      - name: Check the published feed
        if: env.DRY == 'false'
        run: node scripts/release/cli.ts verify-published "$GITHUB_REPOSITORY" "$VERSION" "${{ steps.key.outputs.pubkey }}"

      # Stop the loss first (MoliSpec 006 §6.8.1): back to a draft, so the feed and the download page no
      # longer offer it. Fix, then release a new patch version.
      - name: Take it back if the feed is wrong
        if: failure() && steps.publish.outcome == 'success'
        run: gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=true
