name: Release macOS App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Extract version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: |
          xcodebuild -project MoliWhisper.xcodeproj \
            -scheme MoliWhisper \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION=YES \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build

      - name: Package app
        run: |
          APP_PATH="build/Build/Products/Release/MoliWhisper.app"
          cd "$(dirname "$APP_PATH")"
          zip -r -y "MoliWhisper-${GITHUB_REF_NAME}.zip" "MoliWhisper.app"
          echo "ARTIFACT_PATH=$(pwd)/MoliWhisper-${GITHUB_REF_NAME}.zip" >> "$GITHUB_ENV"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ env.ARTIFACT_PATH }}
          # Tags with a suffix (v1.6.0-beta.1) are published as prereleases.
          prerelease: ${{ contains(github.ref_name, '-') }}
