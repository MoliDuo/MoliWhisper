name: Release

# Two kinds of release:
# - Every push to master that passes CI: a macOS dev build, vX.Y.Z-dev.N
#   (N counts the commits), published as a prerelease. Only the latest
#   KEEP_DEV_BUILDS are kept.
# - A vX.Y.Z tag (scripts/release.sh): the macOS .dmg and the Windows
#   installer. Tags with a `-` (v2.0.0-rc.1) become prereleases.
#
# The .app is signed with the Apple Development certificate in the
# APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD secrets, the same one local
# builds use, so macOS keeps the Accessibility and microphone grants across
# updates. Without the secrets it falls back to an ad-hoc signature.

on:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.ref }}

permissions:
  contents: write

env:
  KEEP_DEV_BUILDS: 10

jobs:
  prepare:
    # Dev builds: only for pushes to this repo's master that passed CI.
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.version.outputs.skip }}
      version: ${{ steps.version.outputs.version }}
      dev: ${{ steps.version.outputs.dev }}
      matrix: ${{ steps.version.outputs.matrix }}
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - name: Work out the version
        id: version
        run: |
          cargo_v=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          mac='{"os":"macos-latest","target":"aarch64-apple-darwin","args":"--target aarch64-apple-darwin --bundles app,dmg"}'
          win='{"os":"windows-latest","target":"x86_64-pc-windows-msvc","args":"--bundles nsis"}'
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="${GITHUB_REF_NAME#v}"
            tauri_v=$(jq -r .version src-tauri/tauri.conf.json)
            node_v=$(jq -r .version package.json)
            echo "tag=$version Cargo.toml=$cargo_v tauri.conf.json=$tauri_v package.json=$node_v"
            if [ "$version" != "$cargo_v" ] || [ "$version" != "$tauri_v" ] || [ "$version" != "$node_v" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the version in the repo; use scripts/release.sh"
              exit 1
            fi
            dev=false
            matrix="[$mac,$win]"
          else
            # A release commit gets its tag build; no dev build for it too.
            if git tag --points-at HEAD | grep -q '^v'; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            version="${cargo_v%%-*}-dev.$(git rev-list --count HEAD)"
            dev=true
            matrix="[$mac]"
          fi
          echo "version=$version"
          {
            echo "skip=false"
            echo "version=$version"
            echo "dev=$dev"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"

      - name: Create a draft release
        id: create
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sha=$(git rev-parse HEAD)
          if [ "${{ steps.version.outputs.dev }}" = true ]; then
            {
              echo "开发版，对应提交 $sha。"
              echo
              git log -1 --format='> %s'
              echo
              cat .github/release-notes.md
            } > "$RUNNER_TEMP/notes.md"
          else
            cp .github/release-notes.md "$RUNNER_TEMP/notes.md"
          fi
          prerelease=false
          case "$VERSION" in *-*) prerelease=true ;; esac
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="v$VERSION" \
            -f target_commitish="$sha" \
            -f name="MoliWhisper $VERSION" \
            -F body=@"$RUNNER_TEMP/notes.md" \
            -F draft=true -F prerelease=$prerelease \
            --jq .id)
          test -n "$id"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Set the dev version
        if: needs.prepare.outputs.dev == 'true'
        run: scripts/set-version.sh "${{ needs.prepare.outputs.version }}"

      # A throwaway keychain with the certificate; the runner is discarded
      # afterwards. Sets APPLE_SIGNING_IDENTITY for the build.
      - name: Import the signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::APPLE_CERTIFICATE is not set; using an ad-hoc signature"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          # The intermediate that issues Apple Development certificates.
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/wwdr.cer"
          security import "$RUNNER_TEMP/wwdr.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/"Apple Development/ {print $2; exit}')
          if [ -z "$identity" ]; then
            echo "::error::no Apple Development identity in APPLE_CERTIFICATE"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          uploadUpdaterJson: false
          retryAttempts: 1

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.prepare.outputs.release_id }}" -F draft=false --jq .html_url

      - name: Delete old dev builds
        if: needs.prepare.outputs.dev == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --limit 200 --json tagName,createdAt \
            --jq "[.[] | select(.tagName | test(\"-dev\\\\.\"))] | sort_by(.createdAt) | reverse | .[$KEEP_DEV_BUILDS:] | .[].tagName" |
            while read -r tag; do
              echo "deleting $tag"
              gh release delete "$tag" -R "$GITHUB_REPOSITORY" --cleanup-tag --yes
            done
