name: Release

# Push a `vX.Y.Z` tag (scripts/release.sh does this) to build the macOS .dmg
# and the Windows installer and publish them as a GitHub release. Tags with
# a `-` (v2.0.0-rc.1) become prereleases.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_v=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          tauri_v=$(jq -r .version src-tauri/tauri.conf.json)
          node_v=$(jq -r .version package.json)
          echo "tag=$tag Cargo.toml=$cargo_v tauri.conf.json=$tauri_v package.json=$node_v"
          if [ "$tag" != "$cargo_v" ] || [ "$tag" != "$tauri_v" ] || [ "$tag" != "$node_v" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version in the repo; use scripts/release.sh"
            exit 1
          fi

      - name: Create a draft release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=false
          case "$GITHUB_REF_NAME" in *-*) prerelease=true ;; esac
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f name="MoliWhisper ${GITHUB_REF_NAME#v}" \
            -F body=@.github/release-notes.md \
            -F draft=true -F prerelease=$prerelease \
            --jq .id)
          test -n "$id"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          uploadUpdaterJson: false
          retryAttempts: 1

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.prepare.outputs.release_id }}" -F draft=false --jq .html_url
