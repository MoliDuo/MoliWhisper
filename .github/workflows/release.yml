name: Release

# Every push to master that passes CI becomes a release, the way MoliSwitch
# does it: version X.Y.N (X.Y from Cargo.toml, N the commit count; see
# build_version in scripts/lib.sh), published as the latest release. Its
# latest.json is the feed the app's updater reads,
#   https://github.com/MoliDuo/MoliWhisper/releases/latest/download/latest.json
# and points at that release's own .app.tar.gz asset, never at "latest".
#
# Two signatures:
# - the .app, with the shared self-signed certificate in CODESIGN_P12_BASE64 /
#   CODESIGN_P12_PASSWORD, the one local builds use, so macOS keeps the
#   Accessibility and microphone grants across updates;
# - the update archive, with the updater key in TAURI_SIGNING_PRIVATE_KEY /
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD (scripts/setup-updater-keys.sh), whose
#   public half is in tauri.conf.json.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

# One release at a time, never cancelled halfway (that leaves a draft behind).
# A newer push waiting here replaces an older one that is still waiting.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  KEEP_RELEASES: 10
  SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  prepare:
    # Only pushes to this repo's master that passed CI.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.version.outputs.skip }}
      version: ${{ steps.version.outputs.version }}
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      - name: Check the updater key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # A release the installed apps can't verify must not go out.
          if [ -z "$(jq -r '.plugins.updater.pubkey // empty' src-tauri/tauri.conf.json)" ]; then
            echo "::error::no updater public key in tauri.conf.json; run scripts/setup-updater-keys.sh"
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set; run scripts/setup-updater-keys.sh"
            exit 1
          fi

      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip() {
            echo "::notice::$1"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)
          [ "$head" = "$SHA" ] || skip "master has moved on to $head; skipping $SHA"
          version=$(bash -c 'source scripts/lib.sh && build_version')
          # Re-running an old build must not publish over a newer release.
          # On a 404 (no full release yet) gh prints the error body to stdout, so clear it.
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null) || latest=""
          latest="${latest#v}"
          if [ -n "$latest" ]; then
            newest=$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -1)
            if [ "$version" = "$latest" ] || [ "$newest" != "$version" ]; then
              skip "$version is not newer than the latest release $latest"
            fi
          fi
          echo "version=$version"
          {
            echo "skip=false"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Create a draft release
        id: create
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "对应提交 $SHA。"
            echo
            git log -1 --format='> %s'
            echo
            cat .github/release-notes.md
          } > "$RUNNER_TEMP/notes.md"
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="v$VERSION" \
            -f target_commitish="$SHA" \
            -f name="MoliWhisper $VERSION" \
            -F body=@"$RUNNER_TEMP/notes.md" \
            -F draft=true -F prerelease=false \
            --jq .id)
          test -n "$id"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-aarch64-apple-darwin

      - name: Set the version and turn on the update archive
        run: |
          scripts/set-version.sh "${{ needs.prepare.outputs.version }}"
          jq '.bundle.createUpdaterArtifacts = true' src-tauri/tauri.conf.json > "$RUNNER_TEMP/tauri.conf.json"
          mv "$RUNNER_TEMP/tauri.conf.json" src-tauri/tauri.conf.json

      # A throwaway keychain with the certificate; the runner is discarded
      # afterwards. Sets APPLE_SIGNING_IDENTITY for the build.
      - name: Import the signing certificate
        env:
          CODESIGN_P12_BASE64: ${{ secrets.CODESIGN_P12_BASE64 }}
          CODESIGN_P12_PASSWORD: ${{ secrets.CODESIGN_P12_PASSWORD }}
        run: |
          if [ -z "$CODESIGN_P12_BASE64" ]; then
            echo "::warning::CODESIGN_P12_BASE64 is not set; using an ad-hoc signature"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CODESIGN_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CODESIGN_P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # Self-signed, so not "valid" to find-identity: do not pass -v.
          identity=$(security find-identity -p codesigning "$keychain" | awk '/"Moli Self-Signed Code Signing"/ {print $2; exit}')
          if [ -z "$identity" ]; then
            echo "::error::no Moli Self-Signed Code Signing identity in CODESIGN_P12_BASE64"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tauriScript: pnpm tauri
          args: --target aarch64-apple-darwin --bundles app,dmg
          uploadUpdaterJson: true
          retryAttempts: 1

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - name: Publish the release
        id: publish
        run: |
          # master may have moved on during the build; the newer push publishes instead.
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)
          if [ "$head" != "$SHA" ]; then
            echo "::notice::master has moved on to $head; dropping the draft for $VERSION"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -f make_latest=true --jq .html_url
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Check the public feed
        if: steps.publish.outputs.published == 'true'
        run: |
          feed="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL "$feed" -o latest.json && [ "$(jq -r .version latest.json)" = "$VERSION" ]; then
              break
            fi
            [ "$attempt" = 6 ] && { echo "::error::$feed does not announce $VERSION"; exit 1; }
            sleep 10
          done
          cat latest.json
          # tauri-action links the asset by its id, which is as fixed as a tag URL.
          url=$(jq -r '.platforms["darwin-aarch64"].url' latest.json)
          if ! gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq '.[].url' | grep -qxF "$url"; then
            echo "::error::the feed points at $url, not at an asset of v$VERSION"
            exit 1
          fi
          test -n "$(jq -r '.platforms["darwin-aarch64"].signature // empty' latest.json)"
          # What the updater does: no token, Accept: application/octet-stream.
          curl -fsSL -H "Accept: application/octet-stream" "$url" -o update.tar.gz
          tar -tzf update.tar.gz | head -3

      - name: Delete old releases
        if: steps.publish.outputs.published == 'true'
        run: |
          # Per-push releases (vX.Y.N, and the earlier vX.Y.Z-dev.N); older tagged prereleases stay.
          gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --limit 200 --json tagName,createdAt \
            --jq "[.[] | select(.tagName | test(\"^v[0-9]+\\\\.[0-9]+\\\\.[0-9]+$|-dev\\\\.\"))] | sort_by(.createdAt) | reverse | .[$KEEP_RELEASES:] | .[].tagName" |
            while read -r tag; do
              echo "deleting $tag"
              gh release delete "$tag" -R "$GITHUB_REPOSITORY" --cleanup-tag --yes
            done
