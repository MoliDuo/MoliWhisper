name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p moli-core

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest

  # GPU 镜像太大，CI 不构建；这里只验证 compose 文件和 fake 镜像（Dockerfile 的公共部分）
  docker:
    runs-on: ubuntu-latest
    env:
      MOLI_ASR_TOKEN: ci-token
    steps:
      - uses: actions/checkout@v5
      - run: docker compose --profile fake config --quiet
      - run: docker compose --profile fake up -d --build --wait asr-fake
      - name: healthz answers with the token
        run: |
          curl -fsS -H "Authorization: Bearer $MOLI_ASR_TOKEN" http://127.0.0.1:8765/healthz
      - run: docker compose --profile fake logs asr-fake
        if: failure()
