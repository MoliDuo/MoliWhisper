[workspace]
resolver = "3"
members = ["crates/moli-core", "src-tauri"]
# Vendored as-is with its own workspace; only its `doubao-ime` crate is used.
exclude = ["vendor/doubao-ime-rs"]

[workspace.package]
version = "2.0.0-rc.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/MoliDuo/MoliWhisper"

[workspace.dependencies]
anyhow = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
hound = "3"

[profile.release]
lto = "thin"
codegen-units = 1
