[package]
name = "doubao-ime-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "doubao-ime 的 C ABI，供其他语言调用"

[lib]
name = "doubao_ime"
# 同时产出动态库（供 dlopen / FFI）与静态库
crate-type = ["cdylib", "staticlib"]

[dependencies]
doubao-ime = { workspace = true, features = ["blocking"] }
