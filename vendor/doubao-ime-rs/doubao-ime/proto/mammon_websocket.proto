// ===========================================================================
// mammon_internal.WebSocketRequest / WebSocketResponse
// 豆包 Frontier 流式 ASR 帧协议
// ===========================================================================
//
// 说明:
//   · 本定义已与线上服务端端到端验证，可直接由任意语言实现。
//   · 响应 f5/f9/f11 为服务端扩展字段，一并声明以保证解析完整。
//   · 用法: protoc --python_out=. mammon_websocket.proto
// ===========================================================================

syntax = "proto3";

package mammon_internal;

// ---------------------------------------------------------------------------
// 客户端 -> 服务端
// ---------------------------------------------------------------------------
message WebSocketRequest {
  string token      = 1;   // SAMI JWT（POST get_config 换取）
  string appkey     = 2;   // asr_config.app_key（TTKitchen 配置下发）
  string namespace  = 3;   // 会话命名空间；语音识别固定 "ASR"
  string version    = 4;   // 协议版本（服务端当前不校验）
  string event      = 5;   // 事件名:
                           //   StartTask / StartSession / TaskRequest /
                           //   FinishSession / FinishTask / Ping
  string payload    = 6;   // JSON 载荷:
                           //   StartSession 时传 "{}" 即可
                           //   音频帧时传 "{}"（音频走 audio_data 字段）
  bytes  audio_data = 7;   // 音频数据: 16kHz 单声道 PCM (s16le)
  string session_id = 8;   // 会话 ID（可选）
}

// ---------------------------------------------------------------------------
// 服务端 -> 客户端
// ---------------------------------------------------------------------------
message WebSocketResponse {
  string task_id     = 1;  // 任务 ID，一次连接内不变
  string message_id  = 2;  // 消息 ID，每帧唯一
  string namespace   = 3;  // 回显命名空间（"ASR" / "ws"）
  string event       = 4;  // 事件名:
                           //   TaskStarted / SessionStarted / Pong
                           //   TaskFailed / SessionFailed
                           //   SessionFinished / TaskFinished
                           //   **空字符串 = 识别结果帧**（见 payload）
  int64  status_code = 5;  // 20000000=OK
                           // 40000000=会话失败 / 40000012=数据非法
                           // 40100003=需要先 StartTask
  string status_text = 6;  // "OK" 或错误描述
  string payload     = 7;  // 识别结果 JSON（event 为空时）:
                           // {"results":[{"text":"...","start_time":0,
                           //  "end_time":1.4,"confidence":0.99,
                           //  "alternatives":[...]}]}
                           // text 为累积全文（非增量）
  string session_id  = 8;  // 会话 ID（保留字段）
  int64  flag        = 9;  // 当前恒为 0
  // 10 保留
  string logid       = 11; // 链路追踪 ID（等同响应头 X-Tt-Logid）
}
